name: CI

on:
  # No `push: branches: [main]` trigger on purpose. release.yml already runs this entire workflow
  # through `workflow_call` on every push to `main`, and both runs land in the same
  # `ci-${{ github.ref }}` concurrency group with cancel-in-progress. A direct trigger therefore
  # only ever races the gated one: one of the two is cancelled, and the cancelled run is what the
  # README's CI badge reports. `main` stays fully covered by release.yml's ci-gate job.
  pull_request:
  workflow_call: # so release.yml can gate on the full CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      # fetch-depth: 0 is REQUIRED, not tidiness. The version is derived from
      # the git tag by hatch-vcs at build time, and a shallow clone carries no
      # tags, so the package would build as an unrelated 0.1.devN.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      # No path argument: `files = ["src", "examples"]` in pyproject.toml is the single source
      # of truth, so CI and a local `uv run mypy` cannot drift apart.
      - name: Type check (mypy)
        run: uv run mypy

      - name: Tests + coverage gate (pytest, 90% line+branch)
        run: uv run pytest

  build:
    # Publish-readiness gate. release.yml only builds AFTER the tag and the GitHub Release are
    # already pushed, so a packaging or metadata failure there yields a tagged version with nothing
    # on PyPI — unrecoverable without burning a version. Building on the PR path (and, through
    # ci-gate, on `main`) is what makes that failure impossible to reach.
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 for the same reason as the `test` job: hatch-vcs derives the version from
      # the tag, and a shallow clone would build an unrelated 0.1.devN.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build sdist + wheel
        run: uv build

      - name: Validate distribution metadata (twine)
        run: uvx twine check --strict dist/*

      # Asserts the OUTCOME of [tool.hatch.build.targets.sdist], not the list itself: a partial
      # include list that still ships tests/ or CI config is worse than none, because it reads as
      # "source only" while it is not.
      - name: Assert the sdist ships source only
        run: |
          python3 -m tarfile -l dist/*.tar.gz > sdist.txt
          cat sdist.txt
          if grep -Eq '/(tests|examples|scripts|\.github|\.rules)/' sdist.txt; then
            echo "::error::the sdist ships non-source directories — check [tool.hatch.build.targets.sdist]"
            exit 1
          fi

  floor:
    # The declared dependency lower bounds are otherwise fiction: every `test` leg installs the
    # exact uv.lock pins, so `httpx>=0.27` / `pydantic>=2.7` are never exercised and a floor that
    # no longer works breaks only for the consumer who resolves to it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # No --frozen: the point is to re-resolve away from the lockfile, down to the oldest version
      # each declared floor allows. Pinned to the minimum supported Python for the same reason.
      - name: Install the oldest allowed dependencies
        run: uv sync --resolution lowest-direct --python 3.12

      # --no-cov: this job proves the floors import and behave. Coverage is the `test` job's gate.
      - name: Tests against the dependency floor
        run: uv run pytest --no-cov

  examples:
    # `examples/` is runnable documentation, and customers copy it. Nothing in CI executes it —
    # that would need live credentials — so this is the floor: every example must at least
    # compile. ruff and mypy (in `test`) cover style, complexity and typing; this catches what
    # neither can, a file that is not valid Python at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Examples compile (compileall)
        run: |
          n=$(ls examples/*.py | wc -l)
          test "$n" -ge 14 || { echo "expected >=14 examples, found $n"; exit 1; }
          python -m compileall -q examples/ || exit 1

  dry:
    # Language-agnostic duplication (DRY) gate — identical across every mailkube repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Copy-paste detection (jscpd)
        run: npx --yes jscpd@4 --config .jscpd.json .
      # Examples are excluded from the run above and measured here instead, at a higher
      # minTokens. Every example repeats the same scaffolding — import, read MAILKUBE_FROM,
      # construct the client — and deduping that into a shared helper would defeat the point of a
      # file you can read top to bottom and paste into your own project. 100 tokens is past that
      # boilerplate (the cliff is at 90) while still catching a genuinely copy-pasted example.
      - name: Copy-paste detection across examples (jscpd)
        run: npx --yes jscpd@4 --config .jscpd.examples.json examples/

  docs:
    # Governance gate: every .rules/*.md must be indexed in AGENTS.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rule-index sync check
        run: ./scripts/check-rule-index.sh
