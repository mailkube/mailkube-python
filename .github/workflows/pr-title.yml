name: PR Title

# Enforce Conventional Commits on the PR title, since PRs are squash-merged using it.
# Only `feat:`, `fix:`, and `perf:` trigger a release on `main`.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    # The job-level `name:` IS the status-check context GitHub reports, and the branch-protection
    # checklist tells maintainers to require a check called `PR-title`. Without this line the
    # context would be the job id `conventional-title`, and a ruleset requiring `PR-title` would
    # wait forever on a check that never reports — blocking every PR. Keep the two in step.
    name: PR-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
