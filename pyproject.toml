[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mailkube"
# Derived from the git tag at build time, never stored in the tree. See
# [tool.hatch.version] below and .rules/RELEASE.md.
dynamic = ["version"]
description = "Mailkube Python SDK"
authors = [{ name = "Mailtactic, Corp." }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<4.0"
keywords = ["mailkube", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7,<3",
]

[project.urls]
Homepage = "https://github.com/mailkube/mailkube"
Repository = "https://github.com/mailkube/mailkube"
Issues = "https://github.com/mailkube/mailkube/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.16.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mailkube"]

# The version IS the git tag. hatch-vcs resolves `v1.5.0` to `1.5.0` at build
# time and writes it into the distribution metadata, which `mailkube._version`
# reads back. Nothing has to be committed for a release to carry its version.
[tool.hatch.version]
source = "vcs"

# Bakes the resolved version into the sdist, so building a wheel from an sdist
# (which `uv build` does) works with no .git directory present.
[tool.hatch.build.hooks.vcs]
version-file = "src/mailkube/_vcs_version.py"

# ── Lint & format ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
# `examples/` holds runnable illustrative scripts (excluded from the wheel), not library code.
extend-exclude = ["examples"]

[tool.ruff.lint]
# E/F/I/UP/B: baseline. C901: complexity (KISS). D: docstrings (documentation).
# SIM/PL/RUF: simplification + refactor smells. ARG: unused args (ISP smell). TRY: exception hygiene.
select = ["E", "F", "I", "UP", "B", "C901", "D", "SIM", "PL", "RUF", "ARG", "TRY"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR2004", "ARG", "S101"]

# ── Type checking ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]

# ── Tests & coverage (90% line + branch, enforced) ────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=mailkube --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=90"

[tool.coverage.run]
source = ["mailkube"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

# ── Release automation (Conventional Commits → SemVer → PyPI via OIDC) ─────────
[tool.semantic_release]
# No `version_toml` and no `version_variables` on purpose: there is no version
# literal anywhere in the tree to rewrite. The tag is the single source of
# truth, semantic-release only creates it, and hatch-vcs reads it back at build
# time. This is what lets the release write NOTHING to `main`. See
# .rules/RELEASE.md for why a bot commit to `main` is not an option.
build_command = ""
commit_parser = "conventional"
major_on_zero = false
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "main"
